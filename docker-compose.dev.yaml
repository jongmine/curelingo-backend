services:
  backend:
    build: .
    container_name: curelingo-backend
    ports:
      - "8080:8080"
      - "9464:9464"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-curelingo}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-curelingo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-curelingo-local}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - curelingo-network

  mysql:
    image: mysql:8.4
    container_name: curelingo-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-curelingo}
      MYSQL_USER: ${MYSQL_USER:-curelingo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-curelingo-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-curelingo-local-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/mysql-public-data-schema.sql:/docker-entrypoint-initdb.d/01-public-data-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - curelingo-network

  mysql-importer:
    build: .
    profiles: [mysql-tools]
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: mysql-sync
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-curelingo}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-curelingo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-curelingo-local}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - curelingo-network

volumes:
  mysql_data:

networks:
  curelingo-network:
    driver: bridge
