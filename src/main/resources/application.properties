spring.application.name=curelingo

# Gemini
gemini.api.url=${GEMINI_API_URL}
gemini.api.key=${GEMINI_API_KEY}

# E-Gen
egen.api.key=${EGEN_API_KEY}
egen.api.base-url=https://apis.data.go.kr/B552657

# MySQL public-data store
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/curelingo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:curelingo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:curelingo-local}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.sql.init.mode=never
server.tomcat.mbeanregistry.enabled=true
management.server.port=${MANAGEMENT_SERVER_PORT:9464}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.usage=true

# E-Gen public-data snapshot import
curelingo.public-data.sync.api-key=${EGEN_API_KEY:}
curelingo.public-data.sync.base-url=${egen.api.base-url}
curelingo.public-data.sync.page-size=${CURELINGO_PUBLIC_DATA_SYNC_PAGE_SIZE:1000}
curelingo.public-data.sync.request-delay=${CURELINGO_PUBLIC_DATA_SYNC_REQUEST_DELAY:500ms}
curelingo.public-data.sync.max-requests-per-run=${CURELINGO_PUBLIC_DATA_SYNC_MAX_REQUESTS_PER_RUN:900}

# Google
google.translation.api.key=${GOOGLE_TRANSLATION_API_KEY}

# Logging Configuration
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.web.reactive.function.client=WARN
logging.level.reactor.netty.http.client=WARN
logging.level.org.springframework.http=WARN
logging.level.org.springframework.web=WARN
logging.level.com.curelingo.curelingo.egen=INFO
logging.level.com.curelingo.curelingo.translation=DEBUG
logging.level.root=INFO
